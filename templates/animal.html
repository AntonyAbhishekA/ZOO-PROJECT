<!DOCTYPE html>
<html>
<head>
    <title>{{ animal.name }}</title>
</head>
<body>
    <h1>{{ animal.name }}</h1>
    <p><strong>Species:</strong> {{ animal.species }}</p>
    <p><strong>Age:</strong> {{ animal.age }}</p>
    <p><strong>Fun Fact:</strong> {{ animal.fun_facts }}</p>
    <p><strong>Emotion:</strong> {{ animal.emotion }}</p>
    <p><strong>Location in enclosure:</strong> {{ animal.location }}</p>
</body>
</html>
