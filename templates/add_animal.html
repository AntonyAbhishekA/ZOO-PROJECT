<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Animal</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f2f2f2;
      padding: 40px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
    }
    h2 {
      text-align: center;
      color: #2c3e50;
    }
    label {
      margin-top: 15px;
      display: block;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 25px;
      background-color: #4CAF50;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #45a049;
    }

    /* Drag and drop area */
    #drop-area {
      border: 2px dashed #ccc;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      background: #fdfdfd;
      margin-top: 10px;
      border-radius: 10px;
    }
    #drop-area:hover {
      border-color: #4CAF50;
    }
    #browse {
      color: #4CAF50;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🦁 Add a New Animal</h2>
    <form method="POST" enctype="multipart/form-data">
      <label>Animal ID</label>
      <input type="text" name="id" required>

      <label>Name</label>
      <input type="text" name="name" required>

      <label>Species</label>
      <input type="text" name="species" required>

      <label>Age</label>
      <input type="number" name="age" required>

      <label>Classification Type</label>
      <select name="type" required>
        <option value="vertebrate">Vertebrate</option>
        <option value="invertebrate">Invertebrate</option>
      </select>

      <label>Class</label>
      <select name="class" required>
        <option value="">-- Select Class --</option>
        <option value="mammal">Mammal</option>
        <option value="bird">Bird</option>
        <option value="reptile">Reptile</option>
        <option value="amphibian">Amphibian</option>
        <option value="fish">Fish</option>
        <option value="insect">Insect</option>
        <option value="arachnid">Arachnid</option>
        <option value="mollusk">Mollusk</option>
        <option value="crustacean">Crustacean</option>
        <option value="worm">Worm</option>
      </select>

      <label>Fun Fact</label>
      <textarea name="fun_facts" required></textarea>

      <label>Location</label>
      <input type="text" name="location" required>

      <label>Emotion</label>
      <input type="text" name="emotion" required>

      <label>Animal Image (Upload or Drag & Drop)</label>
      <div id="drop-area">
        <input type="file" id="imageInput" name="image" accept="image/*" hidden>
        <p>Drag & drop an image here or <span id="browse">browse</span></p>
      </div>
      <input type="hidden" name="image_filename" id="image_filename">

      <button type="submit">Add Animal</button>
    </form>
    <a href="/logout" style="display: inline-block; margin-top: 20px; color: red;">🔓 Logout</a>
  </div>

  <!-- 👇 JavaScript for Drag-and-Drop -->
  <script>
  const dropArea = document.getElementById("drop-area");
  const fileInput = document.getElementById("imageInput");
  const hiddenInput = document.getElementById("image_filename");

  function uploadFile(file) {
    const formData = new FormData();
    formData.append("image", file);

    fetch("/upload", {
      method: "POST",
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      if (data.filename) {
        hiddenInput.value = data.filename;
        dropArea.innerHTML = "✅ Image uploaded: " + data.filename;
      } else {
        dropArea.innerHTML = "❌ Upload failed. Try again.";
      }
    })
    .catch(() => {
      dropArea.innerHTML = "❌ Upload failed. Try again.";
    });
  }

  dropArea.addEventListener("click", () => fileInput.click());
  dropArea.addEventListener("dragover", e => {
    e.preventDefault();
    dropArea.style.borderColor = "green";
  });
  dropArea.addEventListener("dragleave", e => {
    e.preventDefault();
    dropArea.style.borderColor = "#ccc";
  });
  dropArea.addEventListener("drop", e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file) uploadFile(file);
  });
  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (file) uploadFile(file);
  });
</script>
</body>
</html>
