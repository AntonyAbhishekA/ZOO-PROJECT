<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Zoo Project{% endblock %}</title>
  <style>
    /* 🎨 Base Styling */
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f7f6; /* A soft, light gray background */
      color: #333;
      margin: 0;
      padding: 20px;
    }

    a {
      color: #007BFF; /* A standard, recognizable link color */
    }

    /* 🧱 Shared Layout Styles */
    .container, .login-container, .card {
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
      margin: 40px auto;
    }

    h1, h2 {
      text-align: center;
      color: #2c3e50; /* A dark, professional blue-gray */
    }

    label {
      margin-top: 15px;
      display: block;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 25px;
      background-color: #4CAF50; /* A pleasant green */
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #45a049;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #4CAF50;
      font-weight: bold;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }

    /* 📷 Drag & Drop Upload Area */
    #drop-area {
      border: 2px dashed #ccc;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      background: #fdfdfd;
      margin-top: 10px;
      border-radius: 10px;
    }

    #drop-area:hover {
      border-color: #4CAF50;
    }

    #browse {
      color: #4CAF50;
      cursor: pointer;
      font-weight: bold;
    }

    img {
      max-width: 100%;
      border-radius: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  {% block content %}{% endblock %}

</body>
</html>
