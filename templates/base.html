<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Zoo Project{% endblock %}</title>
  <style>
    /* 🎨 Base Styling */
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #ffffff; /* Changed to white for a cleaner base */
      color: #333;
      margin: 0;
      padding: 0; /* Changed from 20px to 0 to allow full-width sections */
    }

    a {
      color: #007BFF;
    }

    /* 🧱 Shared Layout Styles */
    .container, .login-container, .card {
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
      margin: 40px auto;
    }

    h1, h2 {
      text-align: center;
      color: #2c3e50;
    }

    label {
      margin-top: 15px;
      display: block;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 25px;
      background-color: #4CAF50;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #45a049;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #4CAF50;
      font-weight: bold;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }

    /* 📷 Drag & Drop Upload Area */
    #drop-area {
      border: 2px dashed #ccc;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      background: #fdfdfd;
      margin-top: 10px;
      border-radius: 10px;
    }

    #drop-area:hover {
      border-color: #4CAF50;
    }

    #browse {
      color: #4CAF50;
      cursor: pointer;
      font-weight: bold;
    }

    img {
      max-width: 100%;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    /* 🦁 Hero Section Styles (Added Here) */
    .hero-section {
      position: relative;
      height: 80vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      background-image: url('https://images.unsplash.com/photo-1560783935-4654373a45a8');
      background-size: cover;
      background-position: center;
    }

    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-subtitle {
      font-size: 1.5rem;
      font-weight: 300;
      margin: 0;
    }

    .hero-title {
      font-size: 4rem;
      font-weight: 700;
      margin: 10px 0 30px 0;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
    }

    .timing-box {
      display: inline-block;
      background-color: rgba(44, 62, 80, 0.8);
      padding: 10px 25px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      font-size: 1.1rem;
    }

    .timing-box p {
      margin: 0;
    }
  </style>
</head>
<body>

  {% block content %}{% endblock %}

</body>
</html>
